[project]
name = "apiverve-passwordgenerator"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Password Generator creates random passwords, pronounceable strings, and multi-word passphrases configured by length, complexity, and character sets. It outputs generated strings with character counts and configuration metadata."
keywords = ["password generator api", "bulk password generator", "api password generator", "free password generator api", "random password generator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/passwordgenerator?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/passwordgenerator?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/passwordgenerator-api"
Twitter = "https://twitter.com/apivervehq"
