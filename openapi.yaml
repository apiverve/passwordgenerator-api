openapi: 3.0.4
info:
  title: Password Generator
  description: >-
    Password Generator creates random passwords, pronounceable strings, and
    multi-word passphrases configured by length, complexity, and character sets.
    It outputs generated strings with character counts and configuration
    metadata.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/passwordgenerator:
    get:
      summary: Password Generator
      description: Generate passwords with a specified length and complexity
      operationId: passwordgenerator
      parameters:
        - name: count
          in: query
          schema:
            type: integer
          required: false
          description: The number of passwords to generate
          example: 10
        - name: length
          in: query
          schema:
            type: integer
          required: false
          description: The length of the password to generate
          example: 12
        - name: complexity
          in: query
          schema:
            type: string
          required: false
          description: The complexity of the password. Only applies when type is random
          example: strong
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: >-
            The kind of password to generate. random uses the complexity preset,
            pronounceable builds readable syllables, passphrase joins dictionary
            words, and custom honours the include/exclude switches below
          example: random
        - name: includeNumbers
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include digits. Applies to custom and pronounceable, and to random
            at simple complexity
          example: true
        - name: includeSymbols
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include punctuation symbols. Applies to custom, and to random at
            medium complexity
          example: true
        - name: includeUppercase
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include uppercase letters. Applies to custom, and to random at
            simple complexity
          example: true
        - name: includeLowercase
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include lowercase letters in a custom password. Set false to build
            from the other character sets only
          example: true
        - name: excludeSimilar
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Exclude characters that are easy to confuse when read aloud or typed
            (i, l, 1, L, o, 0, O)
          example: true
        - name: excludeAmbiguous
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Exclude brackets, slashes, quotes and other characters that need
            escaping in shells and config files
          example: true
        - name: mixedCase
          in: query
          schema:
            type: boolean
          required: false
          description: Randomly capitalise letters in a pronounceable password
          example: true
        - name: strict
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Guarantee at least one character from every enabled set rather than
            leaving it to chance
          example: true
        - name: wordCount
          in: query
          schema:
            type: integer
          required: false
          description: >-
            How many words a passphrase contains. Only applies when type is
            passphrase
          example: 4
        - name: separator
          in: query
          schema:
            type: string
          required: false
          description: >-
            The character placed between passphrase words. Only applies when
            type is passphrase
          example: '-'
        - name: capitalize
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Capitalise each word of a passphrase. Only applies when type is
            passphrase
          example: true
        - name: analyze
          in: query
          schema:
            type: boolean
          required: false
          description: Return a strength analysis alongside each password
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  passwords:
                    - password: aOwqDh0ZK*P;!M|%oiFYJ!IK%TMXQO
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: Wo:)*V2nMakoVI78[fKu|QDI.E45p|
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: '%XqlsK2qN.9>*&jk6gYIG.[aE,hiRc'
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: WQNY0{R~(G99uc&i62Mve).n<|xt=F
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: 2$m-&z9!5$c3QlxQP{h#@0x~'M/h]T
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: y]e_H)/z2yzbr{4C&hHOb[Q:#/$Hml
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: +iZ,<<+_MR:jJ,JbXTN*3Z,xLo'=@E
                      length: 30
                      metadata:
                        type: random
                        complexity: strong
                      analysis: null
                    - password: x=e6H^U;ajD+)h5Z8$7Wy)^Ob8ERw'
                      length: 30
