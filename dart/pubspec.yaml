name: apiverve_passwordgenerator
description: "Password Generator is a password generator API that creates random passwords, pronounceable passwords and multi-word passphrases from length, complexity and character-set rules, up to 100 per call. Each comes back with its length and the settings used to build it."
version: 1.2.6
homepage: https://apiverve.com/marketplace/passwordgenerator?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/passwordgenerator-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
